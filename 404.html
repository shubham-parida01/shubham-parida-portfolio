<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Shubham Parida</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="js/tailwind-config.js"></script>
</head>
<body class="bg-surface text-text-primary flex flex-col items-center justify-center min-h-screen px-8 text-center">
  <div class="max-w-md w-full flex flex-col items-center gap-6">
    <span class="material-symbols-outlined text-6xl text-accent-blue">error_outline</span>
    <h1 class="text-4xl font-bold font-headline-hero text-primary">404</h1>
    <h2 class="text-xl font-semibold text-text-secondary">Page Not Found</h2>
    <p class="text-text-muted text-sm leading-relaxed">The page you are looking for doesn't exist or has been moved.</p>
    <a href="/" class="mt-4 px-6 py-3 bg-primary text-white rounded-full font-label-pill text-label-pill hover:bg-primary-container transition-all">Return to Home</a>
  </div>
